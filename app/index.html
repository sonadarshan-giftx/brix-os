<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <meta name="title" content="Brixstac - AI-Native Operating System" />
    <meta name="description" content="The AI-native operating system for software companies. Manage projects, teams, and operations with AI agents." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://brixstac.com" />
    <meta property="og:title" content="Brixstac - AI-Native Operating System" />
    <meta property="og:description" content="The AI-native operating system for software companies." />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://brixstac.com" />
    <meta property="twitter:title" content="Brixstac - AI-Native Operating System" />
    <meta property="twitter:description" content="The AI-native operating system for software companies." />
    <meta property="twitter:image" content="/og-image.png" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#5b5fc7" />

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Mask Icon (Safari pinned tab) -->
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5b5fc7" />

    <!-- MS Tile Color -->
    <meta name="msapplication-TileColor" content="#5b5fc7" />

    <!-- Security Headers (meta tag equivalents) -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' wss: https:;" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()" />

    <title>Brixstac</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <style>
      body { margin: 0; background: #f5f5f5; }
      #root { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript><div style="padding:40px">JavaScript is required to run this app.</div></noscript>
    <script>
      window.onerror = function(msg, url, line, col, err) {
        console.error('Global error:', msg, 'at', url, line, col);
        return false;
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
