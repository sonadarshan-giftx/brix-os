upstream auth_service       { server auth:3001; }
upstream workspace_service  { server workspace:3002; }
upstream project_service    { server project:3003; }
upstream chat_service       { server chat:3004; }
upstream billing_service    { server billing:3005; }
upstream admin_service      { server admin:3006; }
upstream ai_gateway_service { server ai-gateway:3007; }

server {
    listen 80;
    server_name brixstac.com www.brixstac.com _;

    client_max_body_size 20M;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # ── Auth Service ─────────────────────────────────────────
    location /api/auth/ {
        proxy_pass http://auth_service/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Project routes (nested under workspaces) ─────────────
    # Rewrites /api/workspaces/{id}/projects/... → /{id}/projects/...
    location ~ ^/api/workspaces/[^/]+/(projects|tickets|sprints|approvals|meetings|calendar) {
        proxy_pass http://project_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        rewrite ^/api/workspaces/([^/]+)/(.*)$ /$1/$2 break;
    }

    # ── Workspace channel meta-routes (RBAC, moderators) → workspace service
    location ~ ^/api/workspaces/[^/]+/channels/[^/]+/(permissions|my-permissions|moderators) {
        proxy_pass http://workspace_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        rewrite ^/api/(.*)$ /$1 break;
    }

    # ── Chat routes (nested under workspaces) ─────────────────
    # Rewrites /api/workspaces/{id}/channels/... → /{id}/channels/...
    location ~ ^/api/workspaces/[^/]+/(channels|conversations|messages|huddles|recordings|audit-logs|retention-policy|legal-holds|read-receipts|quiet-hours|slash-command|polls|guests|scheduled-messages) {
        proxy_pass http://chat_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        rewrite ^/api/workspaces/([^/]+)/(.*)$ /$1/$2 break;
    }

    # ── SCIM 2.0 Provisioning (workspace service) ───────────────
    location /api/workspaces/scim {
        proxy_pass http://workspace_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        rewrite ^/api/workspaces/(.*)$ /$1 break;
    }

    # ── Workspace Service ────────────────────────────────────
    location /api/workspaces {
        proxy_pass http://workspace_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        rewrite ^/api/(.*)$ /$1 break;
    }

    # ── Billing Service ──────────────────────────────────────
    location /api/billing {
        proxy_pass http://billing_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        rewrite ^/api/(.*)$ /$1 break;
    }

    # ── AI Gateway Service ───────────────────────────────────
    location /api/ai {
        proxy_pass http://ai_gateway_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        rewrite ^/api/(.*)$ /$1 break;
    }

    # ── Admin Service ────────────────────────────────────────
    location /api/admin {
        proxy_pass http://admin_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        rewrite ^/api/(.*)$ /$1 break;
    }

    # ── Socket.IO (Chat real-time) ───────────────────────────
    location /socket.io/ {
        proxy_pass http://chat_service/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # ── Health check aggregator ──────────────────────────────
    location /health {
        access_log off;
        return 200 '{"gateway":"ok","ts":"$time_iso8601"}';
        add_header Content-Type application/json;
    }

    # ── Frontend (SPA) ───────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
